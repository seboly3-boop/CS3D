
name: Build CS3D

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: CS3D-Release
          path: build/Release/CS3D.exe
